{% extends 'base.html' %}

{% block content %}
    <h1>Delete Expense</h1>
    <p>Are you sure you want to delete "{{ log.name }}"?</p>
    <form method="post" action="{% url 'delete_log' log.id %}">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>
    <a href="{% url 'logged_expenses' %}">Cancel</a>
{% endblock %}
