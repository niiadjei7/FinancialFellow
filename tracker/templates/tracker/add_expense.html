{% extends 'base.html' %}

{% block content %}
    <h1>Add Expense to {{ budget.name }}</h1>
    <form method="post" action="{% url 'add_expense' budget_id=budget_id %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a href="{% url 'expenses' budget_id%}">Cancel</a>
    </form>
{% endblock %}
