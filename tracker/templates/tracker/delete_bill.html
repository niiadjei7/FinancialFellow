{% extends 'base.html' %}

{% block content %}
    <h1>Delete Bill</h1>
    <p>Are you sure you want to delete "{{ bill.name }}"?</p>
    <form method="post" action="{% url 'delete_bill' bill.id %}">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>
    <a href="{% url 'bill_list' %}">Cancel</a>
{% endblock %}
