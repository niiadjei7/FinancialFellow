{% extends 'base.html' %}
{% load static %}


{% block content %}
<ul>
    <h2>Totals over past months</h2>

    <div id="line-chart"></div>
    <script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script type="module">
      var labels = {{ labels|safe|default:"{}" }};
      var data = {{ data|safe|default:"{}" }};
    
      

      const script = document.createElement('script');
      script.src = "{% static 'monthly.js' %}";
      script.onload = function () {
        console.log(labels)
        console.log(data)
        // Execute any initialization code from script.js, if needed
        initChart(labels, data);
      };
      document.head.appendChild(script);
    </script>
    <a href="{% url 'logged_expenses' %}">Go back</a>
  </ul>
{% endblock %}
